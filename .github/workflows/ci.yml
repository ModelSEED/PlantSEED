name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor and current. The floor is what pyproject declares. Note the
        # KBase SDK base image ships Python 3.8.4 and was last rebuilt in 2022,
        # which is why the v3 plan moves the apps onto a slim base rather than
        # capping the core at 3.8.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Installing from a clean checkout is itself the test: until this repo
      # had a pyproject.toml, nothing here was importable except by PYTHONPATH,
      # which blocked every delivery path.
      # [model] is included so cobrapy is exercised on both interpreters. It
      # earns its place: cobra 0.32.0 is broken on import without its optional
      # `chrr` extra, and an unbounded `cobra>=0.29` walked straight into it.
      # [modelseed] is deliberately excluded — modelseedpy's
      # scikit-learn==1.2.0 pin cannot build on 3.12; see the note in
      # pyproject.toml.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[curate,model,dev]"

      - name: Console scripts resolve
        run: |
          plantseed-annotate --help > /dev/null
          plantseed-reconstruct --help > /dev/null

      - name: Optional extras import
        run: python -c "import cobra; print('cobra', cobra.__version__)"

      # The whole suite, which includes the architectural gates:
      #   Core/tests/test_core_isolation.py  — no platform imports in the core,
      #       and plantseed_core stays pure stdlib (ast-based, so a docstring
      #       naming a forbidden module does not trip it)
      #   Core/tests/test_strings.py         — no new reserved delimiters in
      #       curated role names
      #   Model/tests/test_golden_reconstruction.py — the three published
      #       preprint models still reproduce exactly
      #   Core/tests/test_readonly_mounts.py — the shipped entry points run
      #       with their inputs chmod'd read-only and the mounts declared
      - name: Test suite
        run: pytest -q

  readonly-mounts:
    # KBase binds refdata at /data with mode "ro" and CTS builds its refdata
    # mount with writable=False, so a write into an input directory is a crash
    # on both platforms and a silent success everywhere else. The matrix job
    # above cannot see that: every directory it owns is writable.
    #
    # Core/tests/test_readonly_mounts.py locks its own synthetic inputs, which
    # covers the code it calls. This job widens that to the whole suite against
    # the repository's real data directories, so a write from a test that never
    # thought about mounts fails here rather than during a CTS image review.
    name: read-only refdata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[curate,model,dev]"

      # Data/ is the biochemistry and compartments the reconstructor reads,
      # Papers/ the golden preprint genomes and models, Template/ the model
      # templates. All three are refdata in every deployed shape.
      - name: Lock the inputs
        run: chmod -R a-w Data Papers Scripts/PlantSEED_v3/Template

      - name: Test suite against read-only inputs
        run: pytest -q

      # chmod is a weak instrument on its own: a permissive umask, a root
      # container, or a filesystem that ignores mode bits can all let a write
      # through. Comparing the tree catches it either way.
      - name: Inputs are unchanged
        run: |
          git status --porcelain -- Data Papers Scripts/PlantSEED_v3/Template \
            | tee /tmp/dirty
          test ! -s /tmp/dirty

      # The console script, not just main() — an entry point that only works
      # when called in-process is not an entry point.
      - name: Console script writes only to the declared output mount
        env:
          PLANTSEED_OUTPUT_DIR: ${{ runner.temp }}/output
          PLANTSEED_SCRATCH_DIR: ${{ runner.temp }}/scratch
        run: |
          mkdir -p "$PLANTSEED_OUTPUT_DIR" "$PLANTSEED_SCRATCH_DIR"
          plantseed-reconstruct \
            --genome Papers/bioflux-preprint-260807/Athaliana_TAIR10_annotated_genome.json \
            --template Scripts/PlantSEED_v3/Template/PlantSEED_Biomass_Template.json \
            --compartments Data/PlantSEED_v3/Compartments/PlantSEED_Compartments.json \
            --model-id ci_readonly --out "$PLANTSEED_OUTPUT_DIR/model.json"
          python -c "import json,os,sys; m=json.load(open(os.environ['PLANTSEED_OUTPUT_DIR']+'/model.json')); n=len(m['modelreactions']); print('reactions:', n); sys.exit(0 if n > 1000 else 1)"

      - name: A destination outside the mounts is refused
        env:
          PLANTSEED_OUTPUT_DIR: ${{ runner.temp }}/output
        run: |
          if plantseed-reconstruct \
               --genome Papers/bioflux-preprint-260807/Athaliana_TAIR10_annotated_genome.json \
               --out /tmp/escaped.json --quiet 2>/tmp/err; then
            echo "expected a refusal, got exit 0"; exit 1
          fi
          grep -q "refusing to write outside" /tmp/err

      - name: Unlock so the runner can clean up
        if: always()
        run: chmod -R u+w Data Papers Scripts/PlantSEED_v3/Template

  core-is-standalone:
    # Separate job with no extras installed at all: proves the core imports and
    # reconstructs with zero third-party packages present. This is the property
    # every container relies on, and it is invisible in the matrix above
    # because that installs [curate].
    name: core with no extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with no extras
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Nothing third-party came along
        run: |
          python - <<'PY'
          import importlib.metadata as md
          allowed = {"plantseed", "pip", "setuptools", "wheel"}
          present = {d.metadata["Name"] for d in md.distributions()}
          extra = sorted(present - allowed)
          assert not extra, f"unexpected dependencies pulled in: {extra}"
          print("clean:", sorted(present))
          PY

      - name: Core reconstructs with no extras present
        run: |
          python - <<'PY'
          import json
          from plantseed_model import ReconstructAppImpl

          def load(p):
              with open(p) as fh:
                  return json.load(fh)

          recon = ReconstructAppImpl()
          recon._set_objects({
              "genome": load("Papers/bioflux-preprint-260807/Athaliana_TAIR10_annotated_genome.json"),
              "template": load("Scripts/PlantSEED_v3/Template/PlantSEED_Biomass_Template.json"),
          })
          model = recon.reconstruct_metabolism({
              "id": "ci", "name": "ci",
              "cpts": load("Data/PlantSEED_v3/Compartments/PlantSEED_Compartments.json"),
          })
          published = load("Papers/bioflux-preprint-260807/Athaliana_TAIR10_model.json")
          got = {r["id"] for r in model["modelreactions"]}
          want = {r["id"] for r in published["modelreactions"]}
          assert got == want, f"+{len(got - want)} / -{len(want - got)} reactions"
          print(f"reproduced {len(got)} reactions with no third-party packages installed")
          PY
