[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plantseed"
description = "PlantSEED v3 — plant genome functional annotation, metabolic reconstruction, and curation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sam Seaver", email = "samseaver@gmail.com" }]
keywords = ["metabolic-model", "genome-annotation", "plant", "ModelSEED", "PlantSEED"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dynamic = ["version"]

# The core is deliberately pure stdlib. Anything heavier belongs in an extra
# and may only be imported by code that the corresponding extra installs.
dependencies = []

[project.optional-dependencies]
# plantseed_curation.schema uses PyYAML to load PlantSEED_Schema.yaml.
curate = ["PyYAML>=6"]
# cobrapy is the in-memory model type for FBA/FVA; the neutral MetabolicModel
# type does not require it.
#
# Capped below 0.32: cobra 0.32.0 is broken on import unless its optional
# `chrr` extra is installed. cobra/sampling/hopsy.py evaluates
# `hopsy.UniformCoordinateHitAndRunProposal` as an annotation default at
# class-definition time, but hopsy is only declared under `extra == "chrr"`,
# so a plain `pip install cobra` yields `NameError: name 'hopsy' is not
# defined` on `import cobra`. Verified against 0.32.0 on 3.10, 3.11 and 3.12.
# `cobra[chrr]>=0.32` also works but drags in a native C++ sampler we do not
# use — the cap is the cheaper fix for container size. Lift it once upstream
# guards that import.
model = ["cobra>=0.29,<0.32"]
# Only omics/stats.py::mahalanobis_outliers needs these. Percentile ranks are stdlib.
stats = ["numpy>=1.24", "scipy>=1.10"]
# ModelSEEDpy — the Python modeling library (gapfilling, ATP correction, FBA
# packages). Named `modelseed`, not `msd`: in this ecosystem MSD means
# ModelSEEDDatabase, the biochemistry repo, which is a separate ~80 MB data
# dependency we will vendor rather than pip-install. Do not conflate them.
#
# cshenry/ModelSEEDpy, not ModelSEED/ModelSEEDpy and not PyPI.
#
# The fork is the de-facto build: it is what ModelSEED/modelseed-api installs
# (Dockerfile.standalone: `git clone --branch main
# https://github.com/cshenry/ModelSEEDpy.git`), so it is what actually builds
# models for modelseed.org, and it is also what KB-ModelSEEDReconstruction
# installs on the KBase side. It is ~117 commits ahead of upstream `dev` and
# carries MSFBA, msminimalmedia, and a much larger msexpression. PyPI 0.4.2
# (2025-03) lags both by well over a year.
#
# Pinned to a SHA where both of those track branch HEAD unpinned — their own
# docs/STANDALONE.md concedes the gap: "the image always reflects HEAD of those
# repos at the time the image was built. For reproducible builds against
# pinned commits, pin the --branch <ref> ... to specific commit SHAs." Since a
# published paper depends on our numbers, we pin. Bump deliberately.
#
# Two usage constraints, both load-bearing for containers:
#   * pass annotate_with_rast=False — the True default makes an outbound call
#     to an ANL service, which breaks reproducibility and violates CTS's
#     no-runtime-downloads rule
#   * never call helpers.get_template / helpers.get_classifier at runtime; they
#     write into site-packages. modelseed-api handles this by warming the
#     classifier at image build time, which is the pattern to copy.
#
# KNOWN LIMITATION — this extra does not install on Python 3.12. The fork pins
# `scikit-learn==1.2.0` (a comment there says "version lock for pickle ML
# models"), and 1.2.0 cannot build on 3.12 because it needs distutils, removed
# from the stdlib in 3.12. Verified: fails on 3.12, installs on 3.10 and 3.11.
# modelseed-api works around it by force-reinstalling numpy and scikit-learn
# *after* the editable install (Dockerfile.standalone), and
# KB-ModelSEEDReconstruction by using pip's legacy resolver. Only
# modelseedpy/ml and helpers.get_classifier need sklearn at all, and we use
# neither — so the container-level fix is to install modelseedpy with
# --no-deps. Left honest here rather than papered over; revisit if the fork
# relaxes the pin.
modelseed = [
    "modelseedpy @ git+https://github.com/cshenry/ModelSEEDpy@b758b44217bca756a5e07a70e986fbdfe73dd1b6",
    # modelseedpy requires cobra unbounded; carry the same cap as [model] so
    # installing [modelseed] alone cannot pull the broken 0.32.0.
    "cobra>=0.29,<0.32",
]
all = ["plantseed[curate,model,stats,modelseed]"]
dev = ["pytest>=8", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/ModelSEED/PlantSEED"
Repository = "https://github.com/ModelSEED/PlantSEED"

[project.scripts]
plantseed-annotate = "plantseed_annotation.cli:main"
plantseed-reconstruct = "plantseed_annotation.reconstruct_cli:main"

[tool.setuptools.dynamic]
version = { attr = "plantseed_core.__about__.__version__" }

# Multiple roots so that no source file has to move. Each entry is an existing
# directory that contains one importable package.
[tool.setuptools.packages.find]
where = [
    "Scripts/PlantSEED_v3/Core",
    "Scripts/PlantSEED_v3/Annotation",
    "Scripts/PlantSEED_v3/Curation",
    "Scripts/PlantSEED_v3/Model",
]
include = [
    "plantseed_core*",
    "plantseed_annotation*",
    "plantseed_curation*",
    "plantseed_model*",
]

[tool.pytest.ini_options]
testpaths = [
    "Scripts/PlantSEED_v3/Core/tests",
    "Scripts/PlantSEED_v3/Annotation/tests",
    "Scripts/PlantSEED_v3/Curation/tests",
    "Scripts/PlantSEED_v3/Model/tests",
]
