[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plantseed"
description = "PlantSEED v3 — plant genome functional annotation, metabolic reconstruction, and curation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sam Seaver", email = "samseaver@gmail.com" }]
keywords = ["metabolic-model", "genome-annotation", "plant", "ModelSEED", "PlantSEED"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dynamic = ["version"]

# The core is deliberately pure stdlib. Anything heavier belongs in an extra
# and may only be imported by code that the corresponding extra installs.
dependencies = []

[project.optional-dependencies]
# plantseed_curation.schema uses PyYAML to load PlantSEED_Schema.yaml.
curate = ["PyYAML>=6"]
# cobrapy is the in-memory model type for FBA/FVA; the neutral MetabolicModel
# type does not require it.
#
# 0.32.0 is excluded, not the whole 0.32 line. That single release is broken on
# import unless its optional `chrr` extra is installed: cobra/sampling/hopsy.py
# evaluates `hopsy.UniformCoordinateHitAndRunProposal` as an annotation default
# at class-definition time, while hopsy is only declared under
# `extra == "chrr"`, so a plain install yields `NameError: name 'hopsy' is not
# defined` on `import cobra`. Verified broken on 3.10, 3.11 and 3.12.
# Upstream fixed it in 0.32.1 (released 2026-08-11); verified clean.
model = ["cobra>=0.29,!=0.32.0"]
# Only omics/stats.py::mahalanobis_outliers needs these. Percentile ranks are stdlib.
stats = ["numpy>=1.24", "scipy>=1.10"]
# The MCP server (plantseed_delivery.mcp_server). Only that one module imports
# it, so the rest of the delivery package stays importable and testable on a
# base install. The 2.x line renamed FastMCP to MCPServer; the server handles
# both, so the floor is the older name's last release rather than 2.0.
mcp = ["mcp>=1.9"]
# `curate` is not optional for the server: its curation lookups read
# PlantSEED_Schema.yaml through plantseed_curation, which needs PyYAML.
server = ["plantseed[curate,mcp]"]
all = ["plantseed[curate,model,stats,mcp]"]
# jsonschema is dev-only: it checks that Capability.input_schema() emits a
# valid schema. Nothing at runtime validates against it -- the MCP client and
# KING's explorer do that on their side.
dev = ["pytest>=8", "pytest-cov", "jsonschema>=4"]

# NOT DECLARED HERE, ON PURPOSE — cobrakbase, modelseedpy, and the ModelSEED
# biochemistry database are pinned by commit in deps/external.json and fetched
# with `python deps/fetch.py`.
#
# Two reasons. First, all three are developed far ahead of their PyPI
# registrations — cobrakbase is at 0.3.0 from 2022, ModelSEEDpy at 0.4.2 from
# 2025 — so a PyPI version constraint would freeze us on code that predates
# what modelseed.org actually runs. Second, the alternative of a direct
# reference (`pkg @ git+https://...`) makes the entire distribution
# un-publishable to PyPI, which would cost us `pip install plantseed`.
#
# Only adapters and container builds need them; the science core does not, and
# Core/tests/test_core_isolation.py enforces that.

[project.urls]
Homepage = "https://github.com/ModelSEED/PlantSEED"
Repository = "https://github.com/ModelSEED/PlantSEED"

[project.scripts]
plantseed = "plantseed_core.cli:main"
plantseed-annotate = "plantseed_annotation.cli:main"
plantseed-reconstruct = "plantseed_annotation.reconstruct_cli:main"
plantseed-mcp = "plantseed_delivery.mcp_server:main"
plantseed-refbuild = "plantseed_annotation.refbuild.cli:main"

# Capability declarations are discovered through this group, so the delivery
# repo — or a third party — can add one without editing this package.
[project.entry-points."plantseed.capabilities"]
reconstruct = "plantseed_model.capabilities"

[tool.setuptools.dynamic]
version = { attr = "plantseed_core.__about__.__version__" }

# Multiple roots so that no source file has to move. Each entry is an existing
# directory that contains one importable package.
[tool.setuptools.packages.find]
where = [
    "Scripts/PlantSEED_v3/Core",
    "Scripts/PlantSEED_v3/Annotation",
    "Scripts/PlantSEED_v3/Curation",
    "Scripts/PlantSEED_v3/Model",
    "Scripts/PlantSEED_v3/Delivery",
]
include = [
    "plantseed_core*",
    "plantseed_annotation*",
    "plantseed_curation*",
    "plantseed_model*",
    "plantseed_delivery*",
]

[tool.pytest.ini_options]
testpaths = [
    "Scripts/PlantSEED_v3/Core/tests",
    "Scripts/PlantSEED_v3/Annotation/tests",
    "Scripts/PlantSEED_v3/Curation/tests",
    "Scripts/PlantSEED_v3/Model/tests",
    "Scripts/PlantSEED_v3/Delivery/tests",
]
